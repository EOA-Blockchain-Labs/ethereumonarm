---
# Ethereum on ARM - First Boot Provisioning Playbook
# Single-file playbook with all tasks inline for simplicity.
#
# Layout of this file
#   PHASE 1  read-only : requirements, board/NVMe/home/user discovery, safety gates, plan
#   PHASE 2  changes   : apt, network, disk, users, packages, monitoring, security
#
# Run only PHASE 1 (nothing is modified):  -e plan_only=true

- name: Ethereum on ARM First Boot Provisioning
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars.yml

  module_defaults:
    # apt/dpkg is frequently locked by first-boot jobs (unattended-upgrades, armbian-firstrun...)
    ansible.builtin.apt:
      lock_timeout: 300

  tasks:
    # =========================================================================
    # PHASE 1a - REQUIREMENTS (read-only)
    # =========================================================================
    - name: Display provisioning start
      ansible.builtin.debug:
        msg: "Starting Ethereum on ARM provisioning (plan_only={{ plan_only | bool }})..."

    - name: Check CPU architecture
      ansible.builtin.assert:
        that: ansible_facts['architecture'] in ['aarch64', 'arm64']
        fail_msg: "Unsupported CPU architecture '{{ ansible_facts['architecture'] }}'. An ARM64 board is required."
        quiet: true

    - name: Check installed RAM
      ansible.builtin.assert:
        that: ansible_facts['memtotal_mb'] | int >= min_ram_mb | int
        fail_msg: >-
          This board reports {{ ansible_facts['memtotal_mb'] }} MB of RAM but at least
          {{ min_ram_mb }} MB (16 GB class) is required.
        quiet: true

    - name: Look for the Armbian release file
      ansible.builtin.stat:
        path: /etc/armbian-release
      register: armbian_release

    - name: Check that this is an Armbian image
      ansible.builtin.assert:
        that: armbian_release.stat.exists
        fail_msg: >-
          /etc/armbian-release not found: this does not look like an Armbian image.
          Set require_armbian=false to override.
        quiet: true
      when: require_armbian | bool

    - name: Check the OS release is one this playbook supports
      ansible.builtin.assert:
        that: ansible_facts['distribution_release'] in supported_releases
        fail_msg: >-
          OS release is '{{ ansible_facts['distribution_release'] }}' but this playbook supports
          {{ supported_releases | join(' and ') }} only (the Ethereum on ARM packages are built for
          those). Use an Armbian image based on one of them, or set skip_os_check=true at your
          own risk (third-party APT repositories then use '{{ fallback_release }}').
        quiet: true
      when: not (skip_os_check | bool)

    # Release used in the third-party APT repository lines. Normally the running
    # release; only differs when skip_os_check let an unlisted release through.
    - name: Pick the APT suite for this release
      ansible.builtin.set_fact:
        os_suite: "{{ ansible_facts['distribution_release'] if ansible_facts['distribution_release'] in supported_releases else fallback_release }}"
        apt_suite_by_name: {}

    # Read-only HTTP HEAD requests. Skipped on the fallback release (nothing to decide).
    - name: Check which suites the release-specific APT repositories publish
      ansible.builtin.uri:
        url: "{{ item.suite_probe | replace('@SUITE@', os_suite) }}"
        method: HEAD
        timeout: 20
      register: suite_probe_results
      # First boot: the network may still be coming up. Retry while nothing answered (status -1).
      until: (suite_probe_results.status | default(-1) | int) > 0
      retries: 5
      delay: 6
      failed_when: false
      # Retries exhausted marks the task failed; the next task turns that into a decision.
      ignore_errors: true
      changed_when: false
      loop: "{{ apt_sources | selectattr('suite_probe', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: os_suite != fallback_release

    # A repository that answers with anything other than 200 for this release (typically 404)
    # falls back to fallback_release instead of breaking `apt update` later. If it could not be
    # reached at all (status -1 after the retries) the running release is kept: nothing is known
    # about the suite, and `apt update` would fail on a dead network whatever suite was chosen.
    - name: Record the APT suite chosen for each repository
      ansible.builtin.set_fact:
        apt_suite_by_name: >-
          {{ apt_suite_by_name | combine({item.item.name: (fallback_release if (item.status | default(-1) | int) > 0 and (item.status | int) != 200 else os_suite)}) }}
      loop: "{{ suite_probe_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"

    # =========================================================================
    # PHASE 1b - BOARD DETECTION (read-only)
    # =========================================================================
    - name: Detect device model from device tree
      ansible.builtin.slurp:
        src: /sys/firmware/devicetree/base/model
      register: device_tree_model
      ignore_errors: true

    - name: Set device model fact
      ansible.builtin.set_fact:
        detected_model: "{{ (device_tree_model.content | b64decode | regex_replace('\\x00', '')) if device_tree_model is succeeded else 'Unknown' }}"

    - name: Derive hostname seed (known board pattern, otherwise slug of the model string)
      ansible.builtin.set_fact:
        hostname_seed: >-
          {%- set ns = namespace(seed='', best=0) -%}
          {%- for d in devices.values() -%}
            {%- if d.pattern in detected_model and (d.pattern | length) > ns.best -%}
              {%- set ns.seed = d.hostname_seed -%}
              {%- set ns.best = d.pattern | length -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set slug = detected_model | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', '') | truncate(24, True, '') | regex_replace('-+$', '') -%}
          {%- if ns.seed | length > 0 -%}{{ ns.seed }}
          {%- elif detected_model != 'Unknown' and slug | length > 0 -%}{{ slug }}
          {%- else -%}arm64{%- endif -%}

    - name: Display detected device
      ansible.builtin.debug:
        msg: "Detected device: {{ detected_model }} (hostname seed: {{ hostname_seed }})"

    - name: Calculate swap size (2x RAM, max 64GB)
      ansible.builtin.set_fact:
        calculated_swap_mb: "{{ [ansible_facts['memtotal_mb'] * 2, swap_max_mb] | min | int }}"

    # =========================================================================
    # PHASE 1c - NVMe DISCOVERY (read-only)
    # =========================================================================
    - name: Find the disk that holds the root filesystem
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          src=$(findmnt -rno SOURCE / | sed 's/\[.*$//')
          lsblk -no PKNAME "$src" 2>/dev/null | head -n1
        executable: /bin/bash
      register: root_disk_name
      changed_when: false
      failed_when: false

    - name: List NVMe disks (name and size in bytes)
      ansible.builtin.shell:
        cmd: |
          lsblk -dnbr -o NAME,SIZE,TYPE | awk '$3 == "disk" && $1 ~ /^nvme[0-9]+n[0-9]+$/ {print "/dev/" $1 " " $2}'
      register: nvme_all_raw
      changed_when: false
      # First boot: the NVMe can enumerate a few seconds after the service starts.
      until: nvme_all_raw.stdout_lines | length > 0
      retries: 6
      delay: 5
      # Retries exhausted marks the task failed; "Fail if no suitable NVMe disk" reports it properly.
      ignore_errors: true

    - name: Select NVMe disks that are big enough and do not hold the OS
      ansible.builtin.set_fact:
        nvme_all: "{{ nvme_all_raw.stdout_lines }}"
        nvme_candidates: >-
          {%- set out = [] -%}
          {%- for line in nvme_all_raw.stdout_lines -%}
            {%- set p = line.split() -%}
            {%- if (p[1] | int) >= (min_nvme_size_gb | int) * 1000000000 and p[0] != '/dev/' ~ (root_disk_name.stdout | trim) -%}
              {%- set _ = out.append(p[0]) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Fail if the requested NVMe device is not usable
      ansible.builtin.fail:
        msg: >-
          nvme_device={{ nvme_device }} is not a usable target. Usable NVMe disks
          (>= {{ min_nvme_size_gb }} GB, not holding the OS): {{ nvme_candidates }}.
          NVMe disks seen (path size-in-bytes): {{ nvme_all }}.
      when: nvme_device | length > 0 and nvme_device not in nvme_candidates

    - name: Fail if no suitable NVMe disk was found
      ansible.builtin.fail:
        msg: >-
          No NVMe disk of at least {{ min_nvme_size_gb }} GB (2 TB class) was found
          (disks that hold the OS are ignored). NVMe disks seen (path size-in-bytes): {{ nvme_all }}.
      when: nvme_device | length == 0 and nvme_candidates | length == 0

    - name: Fail if several NVMe disks qualify
      ansible.builtin.fail:
        msg: >-
          More than one NVMe disk qualifies: {{ nvme_candidates }}. Refusing to guess which one
          to use - pass nvme_device=<path> (install.sh --nvme <path>).
      when: nvme_device | length == 0 and nvme_candidates | length > 1

    - name: Set target disk facts
      ansible.builtin.set_fact:
        target_disk: "{{ nvme_device if nvme_device | length > 0 else nvme_candidates[0] }}"
        partition_suffix: "p1"

    - name: Set partition path
      ansible.builtin.set_fact:
        partition_device: "{{ target_disk }}{{ partition_suffix }}"

    - name: Collect every device node of the target disk (disk first, then partitions)
      ansible.builtin.command:
        cmd: "lsblk -nrp -o NAME {{ target_disk }}"
      register: disk_nodes_raw
      changed_when: false

    - name: Collect mount points that use the target disk
      ansible.builtin.shell:
        cmd: |
          for d in $(lsblk -nrp -o NAME {{ target_disk }}); do
            findmnt -rn -S "$d" -o TARGET || true
          done
      register: disk_mounts_raw
      changed_when: false

    - name: Collect active swap on the target disk
      ansible.builtin.shell:
        cmd: "swapon --noheadings --raw --show=NAME | grep -E '^{{ target_disk }}(p[0-9]+)?$' || true"
      register: disk_swap_raw
      changed_when: false

    - name: Classify the mounts of the target disk
      ansible.builtin.set_fact:
        disk_nodes: "{{ disk_nodes_raw.stdout_lines }}"
        disk_mount_targets: "{{ disk_mounts_raw.stdout_lines }}"
        disk_system_mounts: "{{ disk_mounts_raw.stdout_lines | select('match', '^(/|/boot(/.*)?|/usr(/.*)?|/var(/.*)?|/etc(/.*)?|/opt(/.*)?|/root(/.*)?)$') | list }}"
        disk_active_swap: "{{ disk_swap_raw.stdout_lines }}"

    - name: Refuse to touch a disk that holds the operating system or active swap
      ansible.builtin.fail:
        msg: >-
          {{ target_disk }} is in use by the system (mounts: {{ disk_system_mounts }},
          swap: {{ disk_active_swap }}). This installer expects the OS on the SD card/eMMC and
          the NVMe to be a data disk. Nothing has been changed.
      when: disk_system_mounts | length > 0 or disk_active_swap | length > 0

    # =========================================================================
    # PHASE 1d - WHAT IS ON THE NVMe (read-only)
    # =========================================================================
    - name: Check if partition has filesystem
      ansible.builtin.command:
        cmd: "blkid -o value -s TYPE {{ partition_device }}"
      register: partition_type
      changed_when: false
      failed_when: false

    # blkid -p reads the device itself (no cache). Prints "<device> <type>" for the whole disk and
    # for every partition that carries a filesystem, RAID, LVM or LUKS signature.
    - name: Look for signatures on the disk and on every partition
      ansible.builtin.shell:
        cmd: |
          for d in $(lsblk -nrp -o NAME {{ target_disk }}); do
            t=$(blkid -p -o value -s TYPE "$d" 2>/dev/null) || t=""
            if [ -n "$t" ]; then echo "$d $t"; fi
          done
          exit 0
        executable: /bin/bash
      register: disk_signatures_raw
      changed_when: false

    - name: Remember the current filesystem UUID (used to clean stale fstab entries)
      ansible.builtin.command:
        cmd: "blkid -o value -s UUID {{ partition_device }}"
      register: old_partition_uuid_raw
      changed_when: false
      failed_when: false

    - name: Find where the data partition is mounted right now
      ansible.builtin.command:
        cmd: "findmnt -rn -S {{ partition_device }} -o TARGET"
      register: partition_mounts_raw
      changed_when: false
      failed_when: false

    - name: Sort the signatures found
      ansible.builtin.set_fact:
        old_partition_uuid: "{{ old_partition_uuid_raw.stdout | trim }}"
        partition_mount_targets: "{{ partition_mounts_raw.stdout_lines }}"
        partition_in_use: "{{ partition_mounts_raw.stdout_lines | length > 0 }}"
        disk_signatures: "{{ disk_signatures_raw.stdout_lines }}"
        other_ext4_nodes: >-
          {{ disk_signatures_raw.stdout_lines | select('search', ' ext4$') | reject('match', '^' ~ partition_device ~ ' ') | list }}

    # ext4           the first partition is ext4                  -> keep, unless the format flag file is there
    # ext4_elsewhere ext4 exists, but not as the first partition  -> never formatted here, and cannot be used: refuse
    # blank          no signature anywhere (new disk, empty partition table, partitions with no filesystem)
    # foreign        any other filesystem / RAID / LVM / LUKS (NTFS, exFAT, HFS+, APFS, XFS, btrfs, ...)
    - name: Classify the NVMe disk
      ansible.builtin.set_fact:
        disk_state: >-
          {%- if partition_type.stdout | trim == 'ext4' -%}ext4
          {%- elif other_ext4_nodes | length > 0 -%}ext4_elsewhere
          {%- elif (partition_type.stdout | trim | length) == 0 and (disk_signatures | length) == 0 -%}blank
          {%- else -%}foreign{%- endif -%}

    - name: Refuse to touch ext4 data that is not the first partition of the disk
      ansible.builtin.fail:
        msg: >-
          {{ target_disk }} holds an ext4 filesystem that is not its first partition
          ({{ other_ext4_nodes | join(', ') }}). ext4 data is never formatted here without the flag file,
          but only an ext4 first partition can be used as {{ data_mount_point }}. Nothing has been changed.
          Back the data up and wipe the disk yourself (wipefs -a {{ target_disk }}), or pick another disk
          with nvme_device=<path>.
      when: disk_state == 'ext4_elsewhere'

    - name: Refuse if the data mount point is served by another part of the target disk
      ansible.builtin.fail:
        msg: >-
          {{ data_mount_point }} is mounted from {{ target_disk }}, but not from its first partition
          ({{ partition_device }}). Nothing has been changed. Move that data yourself, or pick another
          disk with nvme_device=<path>.
      when: (data_mount_point in disk_mount_targets) and not (data_mount_point in partition_mount_targets)

    # Peek inside an ext4 partition: is the format flag there? what data does it hold?
    # An already-mounted partition is inspected in place (a second, read-only mount of a
    # device that is mounted read-write is refused by the kernel).
    - name: Inspect the existing ext4 partition
      when: disk_state == 'ext4'
      block:
        - name: Create temp mount point
          ansible.builtin.tempfile:
            state: directory
            prefix: "disk_check_"
          register: peek_tmp
          when: partition_mount_targets | length == 0

        - name: Mount partition read-only to check it
          ansible.builtin.command:
            argv: [mount, -o, "ro,noatime", "{{ partition_device }}", "{{ peek_tmp.path }}"]
          when: partition_mount_targets | length == 0
          changed_when: false

        - name: Set inspection root
          ansible.builtin.set_fact:
            peek_root: "{{ partition_mount_targets[0] if partition_mount_targets | length > 0 else peek_tmp.path }}"

        - name: Check for the format flag files
          ansible.builtin.stat:
            path: "{{ peek_root }}/{{ item }}"
          register: format_flag_results
          loop: "{{ format_flag_files }}"

        - name: Check for the ethereum home directory
          ansible.builtin.stat:
            path: "{{ peek_root }}/{{ ethereum_user }}"
          register: ethereum_dir

        # Image upgrade path: a config backup left by ethereumonarm-config-sync on the old
        # installation, restored to client_config_dir once the client packages are installed
        # (PHASE 2f). See the documentation's "Image Upgrade" section.
        - name: Check for a client config backup from a previous installation
          ansible.builtin.stat:
            path: "{{ peek_root }}/{{ client_config_backup_relpath }}"
          register: config_backup_dir

        - name: List top-level content of the partition
          ansible.builtin.command:
            argv: [find, "{{ peek_root }}", -mindepth, "1", -maxdepth, "1", -not, -name, "lost+found", -printf, "%f\\n"]
          register: data_entries_raw
          changed_when: false
      always:
        - name: Unmount temp mount
          ansible.builtin.command:
            cmd: "umount {{ peek_tmp.path }}"
          when: peek_tmp.path is defined
          changed_when: false
          failed_when: false

        - name: Remove temp mount point
          ansible.builtin.file:
            path: "{{ peek_tmp.path }}"
            state: absent
          when: peek_tmp.path is defined
          ignore_errors: true

    - name: Determine if formatting is needed
      ansible.builtin.set_fact:
        format_flag_found: >-
          {{ (format_flag_results.results | default([]) | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | list | length) > 0 }}
        data_entries: "{{ data_entries_raw.stdout_lines | default([]) }}"
        nvme_home_present: "{{ ethereum_dir.stat.isdir | default(false) }}"
        # Whether a config backup was seen on disk right now. should_format isn't known yet at
        # this point (see "Decide" below) - config_backup_found, which also accounts for it,
        # is computed once should_format is available.
        config_backup_seen: "{{ (restore_client_configs | bool) and (config_backup_dir.stat.isdir | default(false)) }}"

    # The three rules:
    #   1. ext4 is kept, unless the format flag file is on it
    #   2. a new / unformatted disk is formatted
    #   3. any other filesystem (Windows, macOS, ...) is formatted
    # The one exception to 3: a non-ext4 first partition that is mounted as the data mount point
    # right now is a live /home - it is left as it is instead of being destroyed under its users.
    - name: Decide
      ansible.builtin.set_fact:
        should_format: >-
          {{ disk_state == 'blank'
             or (disk_state == 'ext4' and (format_flag_found | bool))
             or (disk_state == 'foreign' and not (data_mount_point in partition_mount_targets)) }}

    - name: Work out the filesystem to mount and why
      ansible.builtin.set_fact:
        data_fs_type: "{{ 'ext4' if (should_format | bool) else (partition_type.stdout | trim) }}"
        format_reason: >-
          {%- if disk_state == 'blank' -%}new or unformatted disk (no filesystem found)
          {%- elif disk_state == 'ext4' -%}format flag file found
          {%- else -%}other filesystem ({{ disk_signatures | join('; ') }}){%- endif -%}
        # A backup seen above doesn't survive a format: if the disk is about to be wiped,
        # there is nothing left to restore from by the time PHASE 2f runs.
        config_backup_found: "{{ config_backup_seen | bool and not (should_format | bool) }}"

    # =========================================================================
    # PHASE 1e - WHERE /home LIVES TODAY AND WHO ALREADY EXISTS (read-only)
    # =========================================================================
    - name: Find what backs the data mount point
      ansible.builtin.command:
        cmd: "findmnt -rn -T {{ data_mount_point }} -o TARGET,SOURCE,FSTYPE"
      register: home_fs
      changed_when: false
      failed_when: false

    - name: Set /home location facts
      ansible.builtin.set_fact:
        home_mount_target: "{{ home_fs.stdout.split()[0] if home_fs.stdout | trim | length > 0 else '/' }}"
        home_mount_source: "{{ (home_fs.stdout.split()[1] | regex_replace('\\[.*$', '')) if home_fs.stdout | trim | length > 0 else 'rootfs' }}"
        home_on_target_partition: "{{ data_mount_point in partition_mount_targets }}"

    - name: Set /home mount-type facts
      ansible.builtin.set_fact:
        home_is_separate_mount: "{{ home_mount_target == data_mount_point }}"

    - name: List what /home currently contains (when it is not already the NVMe)
      ansible.builtin.command:
        argv: [find, "{{ data_mount_point }}", -mindepth, "1", -maxdepth, "1", -not, -name, "lost+found", -printf, "%f\\n"]
      register: home_entries_raw
      changed_when: false
      failed_when: false
      when: not (home_on_target_partition | bool)

    - name: Decide whether the current /home has to be migrated to the NVMe
      ansible.builtin.set_fact:
        home_entries: "{{ home_entries_raw.stdout_lines | default([]) }}"
        migrate_home: >-
          {{ (migrate_existing_home | bool)
             and not (home_on_target_partition | bool)
             and (home_entries_raw.stdout_lines | default([]) | length > 0) }}

    - name: Read UID range
      ansible.builtin.shell:
        cmd: |
          awk '/^UID_MIN/{a=$2} /^UID_MAX/{b=$2} END{print (a ? a : 1000) ":" (b ? b : 60000)}' /etc/login.defs
      register: uid_range
      changed_when: false

    - name: Read the passwd database
      ansible.builtin.getent:
        database: passwd

    - name: Read the group database
      ansible.builtin.getent:
        database: group

    - name: Work out which regular users already exist
      ansible.builtin.set_fact:
        uid_min: "{{ uid_range.stdout | trim | split(':') | first }}"
        uid_max: "{{ uid_range.stdout | trim | split(':') | last }}"
        invoking_user: "{{ lookup('env', 'SUDO_USER') }}"
        ethereum_user_exists: "{{ ethereum_user in ansible_facts.getent_passwd }}"

    - name: Build the user lists
      ansible.builtin.set_fact:
        regular_users: >-
          {%- set out = [] -%}
          {%- for name, f in ansible_facts.getent_passwd.items() -%}
            {%- if (f[1] | int) >= (uid_min | int) and (f[1] | int) <= (uid_max | int) -%}
              {%- set _ = out.append({'name': name, 'uid': f[1] | int, 'home': f[4]}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Decide what happens to the other users
      ansible.builtin.set_fact:
        other_users: "{{ regular_users | rejectattr('name', 'equalto', ethereum_user) | list }}"
        users_to_remove: >-
          {{ (regular_users | rejectattr('name', 'equalto', ethereum_user) | map(attribute='name')
              | reject('equalto', invoking_user) | list)
             if existing_users_policy == 'remove' else [] }}
        ethereum_password_managed: "{{ (not (ethereum_user in ansible_facts.getent_passwd)) or (reset_ethereum_password | bool) }}"

    - name: List the users that stay
      ansible.builtin.set_fact:
        users_kept: "{{ other_users | map(attribute='name') | reject('in', users_to_remove) | list }}"

    - name: Warn if the playbook lives under the data mount point
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ playbook_dir }} is under {{ data_mount_point }}, which is about to be
          replaced by the NVMe mount. The run should still finish (everything is already loaded)
          but run it from another directory (install.sh uses /opt/eoa-installer) to be safe.
      when: playbook_dir is match(data_mount_point ~ '(/|$)')

    # =========================================================================
    # PHASE 1f - PLAN + SAFETY GATE
    # =========================================================================
    - name: Build the plan
      ansible.builtin.set_fact:
        plan_lines:
          - "OS release      : {{ ansible_facts['distribution_release'] }} (supported: {{ supported_releases | join(', ') }}); APT suites - {% for s in apt_sources if s.suite_probe is defined %}{% set suite = apt_suite_by_name[s.name] | default(os_suite) %}{{ s.name }}: {{ suite }}{{ ' (' ~ os_suite ~ ' not published there, using fallback)' if suite != os_suite else '' }}{{ '; ' if not loop.last else '' }}{% endfor %}"
          - "Board           : {{ detected_model }} ({{ ansible_facts['memtotal_mb'] }} MB RAM, hostname seed '{{ hostname_seed }}')"
          - >-
            NVMe disk       : {{ target_disk }}
            ({{ ((nvme_all | select('match', '^' ~ target_disk ~ ' ') | first).split()[1] | int / 1000000000) | round | int }} GB),
            {% if disk_state == 'blank' %}new or unformatted (no filesystem found)
            {% elif disk_state == 'ext4' %}ext4 on {{ partition_device }}, top-level content: {{ data_entries | join(', ') if data_entries | length > 0 else 'empty' }}
            {% else %}other filesystem: {{ disk_signatures | join('; ') }}
            {% endif %}
          - >-
            NVMe action     : {% if should_format | bool %}FORMAT - {{ format_reason }} - everything on {{ target_disk }} will be DESTROYED
            {% elif disk_state == 'ext4' %}KEEP - ext4 data preserved (no format flag file){% if partition_in_use | bool %}, already mounted at {{ partition_mount_targets | join(', ') }}{% endif %}
            {% else %}KEEP - {{ partition_device }} is in use as {{ data_mount_point }} ({{ partition_type.stdout | trim }}), left as it is
            {% endif %}
          - "/home now        : {{ 'on the NVMe already (' ~ partition_device ~ ')' if home_on_target_partition | bool else ('a separate mount from ' ~ home_mount_source if home_is_separate_mount | bool else 'on the root filesystem (' ~ home_mount_source ~ ')') }}"
          - "/home migration  : {{ 'YES - ' ~ (home_entries | length) ~ ' entr' ~ ('y' if home_entries | length == 1 else 'ies') ~ ' (' ~ (home_entries | join(', ')) ~ ') copied to the NVMe first; existing NVMe files are never overwritten' if migrate_home | bool else 'not needed' }}"
          - "Client configs  : {{ 'found at ' ~ client_config_backup_dir ~ ' - will be restored to ' ~ client_config_dir ~ ' after packages install' if config_backup_found | bool else 'no backup found, nothing to restore' }}"
          - "Existing users  : {{ ((other_users | map(attribute='name') | list) + ([ethereum_user ~ ' (already exists)'] if ethereum_user_exists | bool else [])) | join(', ') or 'none' }}"
          - "User actions    : remove accounts [{{ users_to_remove | join(', ') or 'none' }}] (home directories are kept); keep [{{ users_kept | join(', ') or 'none' }}]{{ ' - ' ~ invoking_user ~ ' launched this run and is protected' if invoking_user | length > 0 and invoking_user in users_kept and existing_users_policy == 'remove' else '' }}; ethereum user {{ 'exists - password left alone' if (ethereum_user_exists | bool and not (ethereum_password_managed | bool)) else ('will be created' if not (ethereum_user_exists | bool) else 'exists - password will be reset') }}"

    - name: Show the plan
      ansible.builtin.debug:
        msg: "{{ plan_lines | join('\n') }}"

    - name: Stop here in plan-only mode
      ansible.builtin.meta: end_play
      when: plan_only | bool

    # =========================================================================
    # PHASE 2a - APT SETUP
    # =========================================================================
    - name: Set DEBIAN_FRONTEND to noninteractive
      ansible.builtin.lineinfile:
        path: /etc/environment
        line: "DEBIAN_FRONTEND=noninteractive"
        create: true
        mode: "0644"

    # curl and gpg are needed by the key tasks below, before base_packages is installed.
    # Minimal Armbian images do not always ship them.
    - name: Install prerequisites for APT key handling
      ansible.builtin.apt:
        name: [ca-certificates, curl, gpg]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add APT repository keys (binary format)
      ansible.builtin.get_url:
        url: "{{ item.key_url }}"
        dest: "{{ item.keyring }}"
        mode: "0644"
      loop: "{{ apt_sources }}"
      when: item.key_url is defined and not (item.dearmor | default(false))

    - name: Add APT repository keys (dearmor ASCII keys)
      ansible.builtin.shell:
        cmd: 'curl -fsSL "{{ item.key_url }}" | gpg --dearmor -o "{{ item.keyring }}"'
        creates: "{{ item.keyring }}"
      loop: "{{ apt_sources }}"
      when: item.key_url is defined and (item.dearmor | default(false))

    - name: Add APT pinning for Nginx
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/99nginx
        content: |
          Package: *
          Pin: origin nginx.org
          Pin: release o=nginx
          Pin-Priority: 900
        mode: "0644"
      when: apt_sources | selectattr('name', 'equalto', 'nginx') | selectattr('pinning', 'defined') | list | length > 0

    - name: Add APT repositories
      ansible.builtin.apt_repository:
        repo: "{{ item.repo | replace('@SUITE@', apt_suite_by_name[item.name] | default(os_suite)) }}"
        state: present
        filename: "{{ item.name }}"
      loop: "{{ apt_sources }}"

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
      retries: 3
      delay: 10

    # =========================================================================
    # PHASE 2b - NETWORK CONFIGURATION
    # =========================================================================
    - name: Check if netplan is used
      ansible.builtin.stat:
        path: /etc/netplan
      register: netplan_dir

    - name: Create netplan override for optional interfaces
      ansible.builtin.copy:
        dest: /etc/netplan/99-optional-interfaces.yaml
        content: |
          network:
            version: 2
            ethernets:
              all-eth-interfaces:
                optional: true
                dhcp4: true
        mode: "0600"
      when: netplan_dir.stat.isdir | default(false)

    - name: Ensure timesyncd config directory exists
      ansible.builtin.file:
        path: /etc/systemd/timesyncd.conf.d
        state: directory
        mode: "0755"

    - name: Configure NTP servers
      ansible.builtin.copy:
        dest: /etc/systemd/timesyncd.conf.d/custom-ntp.conf
        content: |
          [Time]
          NTP={{ ntp_servers | join(' ') }}
          PollIntervalMinSec=16
          PollIntervalMaxSec=64
        mode: "0644"
      notify: Restart timesyncd

    - name: Enable NTP synchronization
      ansible.builtin.command:
        cmd: timedatectl set-ntp true
      changed_when: false
      failed_when: false

    - name: Get active network interface
      ansible.builtin.shell:
        cmd: |
          ip route get 8.8.8.8 | awk '{for (i = 1; i <= NF; i++) if ($i == "dev") { print $(i + 1); exit }}'
      register: active_interface
      changed_when: false
      ignore_errors: true

    - name: Get MAC address
      ansible.builtin.slurp:
        src: "/sys/class/net/{{ active_interface.stdout }}/address"
      register: mac_address
      when: active_interface.stdout | default('') | length > 0
      ignore_errors: true

    - name: Generate hostname from MAC
      ansible.builtin.set_fact:
        generated_hostname: "ethereumonarm-{{ hostname_seed }}-{{ (mac_address.content | b64decode | trim | hash('sha256'))[:8] }}"
      when: mac_address.content is defined

    - name: Set system hostname
      ansible.builtin.hostname:
        name: "{{ generated_hostname }}"
      when: generated_hostname is defined

    - name: Update /etc/hostname
      ansible.builtin.copy:
        dest: /etc/hostname
        content: "{{ generated_hostname }}\n"
        mode: "0644"
      when: generated_hostname is defined

    - name: Update /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^127\\.0\\.1\\.1"
        line: "127.0.1.1\t{{ generated_hostname }}"
      when: generated_hostname is defined

    # =========================================================================
    # PHASE 2c - DISK CONFIGURATION
    # =========================================================================
    - name: Display format decision
      ansible.builtin.debug:
        msg: "Disk {{ target_disk }} will {{ 'BE FORMATTED' if should_format | bool else 'NOT be formatted (data preserved)' }}"

    # ---- Format disk if needed ------------------------------------------------
    - name: Unmount everything that is mounted from the target disk
      ansible.builtin.command:
        cmd: "umount {{ item }}"
      loop: "{{ disk_mount_targets | reverse | list }}"
      when: should_format | bool
      register: umount_result
      failed_when: false

    - name: Stop if a mount could not be released
      ansible.builtin.fail:
        msg: >-
          Could not unmount {{ item.item }}: {{ item.stderr }}. Close every shell/process that uses it
          (or reboot without it mounted) and run again. Nothing has been wiped.
      loop: "{{ umount_result.results | default([]) }}"
      when: (should_format | bool) and item.rc is defined and item.rc != 0

    - name: Drop stale fstab entries that use the old partition device path
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^{{ partition_device }}\\s"
        state: absent
        backup: true
      when: should_format | bool

    - name: Drop stale fstab entries that use the old filesystem UUID
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: "^UUID={{ old_partition_uuid }}\\s"
        state: absent
        backup: true
      when: (should_format | bool) and old_partition_uuid | length > 0

    - name: Wipe filesystem signatures (partitions first, then the disk)
      ansible.builtin.command:
        cmd: "wipefs --all --force {{ item }}"
      loop: "{{ disk_nodes | reverse | list }}"
      when: should_format | bool

    - name: Create GPT partition table
      ansible.builtin.shell:
        cmd: 'echo "label: gpt" | sfdisk --force --no-reread "{{ target_disk }}"'
      when: should_format | bool

    - name: Create Linux partition
      ansible.builtin.shell:
        cmd: 'echo "type=linux" | sfdisk --append --force --no-reread "{{ target_disk }}"'
      when: should_format | bool

    - name: Probe partition table
      ansible.builtin.command:
        cmd: "partprobe {{ target_disk }}"
      when: should_format | bool

    - name: Trigger udev
      ansible.builtin.command:
        cmd: udevadm settle
      when: should_format | bool

    - name: Wait for partition
      ansible.builtin.wait_for:
        path: "{{ partition_device }}"
        timeout: 30
      when: should_format | bool

    - name: Format partition with ext4
      community.general.filesystem:
        fstype: ext4
        dev: "{{ partition_device }}"
        opts: "-L {{ data_label }}"
        force: true
      when: should_format | bool

    - name: Set reserved blocks to 0%
      ansible.builtin.command:
        cmd: "tune2fs -m 0 {{ partition_device }}"
      when: should_format | bool

    - name: Get partition UUID
      ansible.builtin.command:
        cmd: "blkid -o value -s UUID {{ partition_device }}"
      register: partition_uuid
      changed_when: false

    # ---- Scenario: /home currently lives on the SD card / eMMC ----------------
    # Copy it to the NVMe BEFORE the NVMe is mounted over it, otherwise the
    # existing users' files would silently disappear under the new mount.
    - name: Copy the current /home to the data partition
      when: migrate_home | bool
      block:
        - name: Create staging mount point
          ansible.builtin.tempfile:
            state: directory
            prefix: "home_stage_"
          register: stage_tmp

        - name: Mount the data partition on the staging directory
          ansible.builtin.command:
            argv: [mount, "{{ partition_device }}", "{{ stage_tmp.path }}"]
          changed_when: true

        - name: Copy /home (existing files on the NVMe are never overwritten)
          ansible.builtin.command:
            argv:
              - rsync
              - -aHAX
              - --numeric-ids
              - --ignore-existing
              - --exclude=/lost+found
              - "{{ data_mount_point }}/"
              - "{{ stage_tmp.path }}/"
          register: home_rsync
          # 24 = some files vanished while copying (live session files) - harmless
          failed_when: home_rsync.rc not in [0, 24]
          changed_when: true
      always:
        - name: Unmount the staging directory
          ansible.builtin.command:
            cmd: "umount {{ stage_tmp.path }}"
          when: stage_tmp.path is defined
          changed_when: false
          failed_when: false

        - name: Remove the staging directory
          ansible.builtin.file:
            path: "{{ stage_tmp.path }}"
            state: absent
          when: stage_tmp.path is defined
          ignore_errors: true

    # ---- Scenario: /home is a separate partition on another device -----------
    - name: Release the previous /home mount (different device)
      ansible.builtin.command:
        cmd: "umount {{ data_mount_point }}"
      register: old_home_umount
      when: (home_is_separate_mount | bool) and not (home_on_target_partition | bool)
      changed_when: true
      failed_when: false

    - name: Stop if the previous /home could not be released
      ansible.builtin.fail:
        msg: >-
          {{ data_mount_point }} (from {{ home_mount_source }}) is busy: {{ old_home_umount.stderr }}.
          Its content was already copied to the NVMe. Close sessions that use it (log in as root on
          the console) and run again.
      when: old_home_umount.rc is defined and old_home_umount.rc != 0

    - name: Mount the data partition on /home and persist it in /etc/fstab
      ansible.posix.mount:
        path: "{{ data_mount_point }}"
        src: "UUID={{ partition_uuid.stdout }}"
        fstype: "{{ data_fs_type }}"
        opts: defaults,noatime
        state: mounted

    - name: Look for an existing ethereum home on the data disk
      ansible.builtin.stat:
        path: "{{ ethereum_home }}"
      register: ethereum_home_stat

    # Data kept from a previous install: reuse its numeric IDs so no ownership change is needed.
    - name: Reuse the numeric IDs of the existing ethereum home when they are free
      ansible.builtin.set_fact:
        ethereum_uid_hint: "{{ ethereum_home_stat.stat.uid }}"
        ethereum_gid_hint: "{{ ethereum_home_stat.stat.gid }}"
      when:
        - not (ethereum_user_exists | bool)
        - ethereum_home_stat.stat.isdir | default(false)
        - ethereum_home_stat.stat.uid | default(0) | int >= uid_min | int
        - ethereum_home_stat.stat.gid | default(0) | int >= uid_min | int
        - (ethereum_home_stat.stat.uid | string) not in (ansible_facts.getent_passwd.values() | map(attribute='1') | list)
        - (ethereum_home_stat.stat.gid | string) not in (ansible_facts.getent_group.values() | map(attribute='1') | list)
        - ethereum_group not in ansible_facts.getent_group

    # =========================================================================
    # PHASE 2d - USER SETUP
    # =========================================================================
    - name: Make sure the supplementary groups exist
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
        system: true
      loop: "{{ ethereum_groups }}"

    - name: Create ethereum group
      ansible.builtin.group:
        name: "{{ ethereum_group }}"
        gid: "{{ ethereum_gid_hint | default(omit) }}"
        state: present

    - name: Create (or adopt) the ethereum user
      ansible.builtin.user:
        name: "{{ ethereum_user }}"
        comment: "{{ 'Ethereum Node Operator' if not (ethereum_user_exists | bool) else omit }}"
        uid: "{{ ethereum_uid_hint | default(omit) }}"
        group: "{{ ethereum_group }}"
        shell: /bin/bash
        create_home: true
        home: "{{ ethereum_home }}"
        move_home: true
        password: "{{ ethereum_password | password_hash('sha512') }}"
        update_password: on_create

    # Password expiry is forced later, in FINAL ACCESS ENFORCEMENT (after packages install).
    # Doing it here, before Phase 2e, expired the account mid-install: any package postinst
    # script that runs setup as this user (su/runuser) would be rejected by PAM before it
    # could do anything, since a non-interactive session can't satisfy a forced password change.

    - name: Add user to groups
      ansible.builtin.user:
        name: "{{ ethereum_user }}"
        groups: "{{ ethereum_groups }}"
        append: true

    - name: Create sudoers file
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-ethereum-nopasswd
        content: "{{ ethereum_user }} ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: "visudo -c -f %s"

    # SSH configuration is handled in the FINAL ACCESS ENFORCEMENT section
    # to ensure it runs after all packages are installed

    # On a preserved disk, the reuse-hint logic (PHASE 2c) only assigns the on-disk owner's
    # UID/GID to the new account when nothing else on this SD card already holds them. When it
    # can't (for example, a still-present other user happens to have the same UID as the old
    # ethereum owner), the account above gets a different UID than the directory on disk. Some
    # package postinst scripts (in PHASE 2e, next) set up their own files as this user
    # (sudo -u ethereum / su ethereum) and need the home directory to already be theirs, so the
    # ownership has to be fixed here, before any package installs, not only at the end of the run.
    - name: Check ethereum home ownership
      ansible.builtin.command:
        argv:
          - find
          - "{{ ethereum_home }}"
          - -xdev
          - "("
          - "!"
          - -user
          - "{{ ethereum_user }}"
          - -o
          - "!"
          - -group
          - "{{ ethereum_group }}"
          - ")"
          - -print
          - -quit
      register: ownership_check
      changed_when: false

    # Only touches the tree when something is actually wrong (a preserved multi-TB
    # chain database is not rewritten on every run).
    - name: Fix ethereum home ownership
      ansible.builtin.command:
        argv: [chown, -R, --no-dereference, "{{ ethereum_user }}:{{ ethereum_group }}", "{{ ethereum_home }}"]
      when: ownership_check.stdout | length > 0

    # =========================================================================
    # PHASE 2e - PACKAGE INSTALLATION
    # =========================================================================
    - name: Install Ethereum packages
      ansible.builtin.apt:
        name: "{{ ethereum_packages }}"
        state: present
      retries: 3
      delay: 10

    - name: Fix any broken dpkg packages
      ansible.builtin.command:
        cmd: dpkg --configure -a
      ignore_errors: true
      changed_when: false

    - name: Install Nginx packages
      ansible.builtin.apt:
        name: "{{ nginx_packages }}"
        state: present
      retries: 3
      delay: 10
      register: nginx_install

    - name: Ensure Nginx is configured correctly after install
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_config_test
      failed_when: false
      changed_when: false
      when: nginx_install is succeeded

    - name: Warn if Nginx configuration has issues
      ansible.builtin.debug:
        msg: "Warning: Nginx configuration test failed. Check /etc/nginx/ for issues."
      when: nginx_config_test.rc is defined and nginx_config_test.rc != 0

    # =========================================================================
    # PHASE 2f - ETHEREUM CONFIGURATION
    # =========================================================================
    # Image upgrade path: restore client configs a previous installation backed up with
    # ethereumonarm-config-sync (see the documentation's "Image Upgrade" section), now that the
    # freshly installed client packages have written their own defaults. Never deletes: a file
    # the backup doesn't have (a new default from a newer client version) is left as the package
    # installed it; a file the backup does have overwrites that fresh default. A restore failure
    # (full disk, bad backup, ...) fails the run rather than silently continuing on empty configs.
    - name: Restore client configs from a previous installation
      when: config_backup_found | bool
      block:
        - name: Make sure the client config directory exists
          ansible.builtin.file:
            path: "{{ client_config_dir }}"
            state: directory
            mode: "0755"

        - name: Restore client configs
          ansible.builtin.command:
            argv: [rsync, -a, --min-size=1, "{{ client_config_backup_dir }}/", "{{ client_config_dir }}/"]
          register: config_restore

        # Like the ethereum home directory, the backup can carry the previous installation's
        # numeric UID/GID (rsync -a preserves them), and that UID isn't guaranteed to still
        # belong to the ethereum account on this SD card - so ownership is set explicitly
        # rather than trusted from the backup.
        - name: Fix client config ownership
          ansible.builtin.command:
            argv: [chown, -R, --no-dereference, "{{ ethereum_user }}:{{ ethereum_group }}", "{{ client_config_dir }}"]

    - name: Write EOA release file
      ansible.builtin.copy:
        dest: /etc/eoa-release
        content: "Ethereum on ARM {{ ansible_facts['date_time']['year'][-2:] }}.{{ ansible_facts['date_time']['month'] }}.{{ eoa_minor_version }}\n"
        mode: "0644"

    - name: Add update-ethereum alias
      ansible.builtin.blockinfile:
        path: /etc/bash.bashrc
        block: |
          # Shortcut to update Ethereum packages
          alias update-ethereum='sudo apt-get update && sudo apt-get install {{ ethereum_packages | join(" ") }}'
        marker: "# {mark} ETHEREUM ON ARM ALIAS"
        create: true
        mode: "0644"

    - name: Configure swap location
      ansible.builtin.lineinfile:
        path: /etc/dphys-swapfile
        regexp: "^#?CONF_SWAPFILE="
        line: "CONF_SWAPFILE={{ swap_file }}"

    - name: Configure swap size
      ansible.builtin.lineinfile:
        path: /etc/dphys-swapfile
        regexp: "^#?CONF_SWAPSIZE="
        line: "CONF_SWAPSIZE={{ calculated_swap_mb }}"

    - name: Configure max swap
      ansible.builtin.lineinfile:
        path: /etc/dphys-swapfile
        regexp: "^#?CONF_MAXSWAP="
        line: "CONF_MAXSWAP={{ calculated_swap_mb }}"

    - name: Enable swap service
      ansible.builtin.systemd:
        name: dphys-swapfile
        enabled: true
        state: started

    # =========================================================================
    # PHASE 2g - MONITORING SETUP
    # =========================================================================
    - name: Create prometheus user
      ansible.builtin.user:
        name: "{{ prometheus_user }}"
        system: true
        create_home: true
        home: "{{ prometheus_home }}"
        shell: /usr/sbin/nologin

    - name: Create prometheus directories
      ansible.builtin.file:
        path: "{{ prometheus_home }}/{{ item }}"
        state: directory
        owner: "{{ prometheus_user }}"
        group: "{{ prometheus_user }}"
        mode: "0755"
      loop: "{{ prometheus_dirs }}"

    - name: Install monitoring packages
      ansible.builtin.apt:
        name: "{{ monitoring_packages }}"
        state: present
      retries: 3
      delay: 10

    - name: Enable prometheus
      ansible.builtin.systemd:
        name: prometheus
        enabled: true

    - name: Enable node exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true

    - name: Enable grafana
      ansible.builtin.systemd:
        name: grafana-server
        enabled: true

    - name: Run monitoring extras
      ansible.builtin.command:
        cmd: set-ethereumonarm-monitoring-extras -o
      ignore_errors: true
      changed_when: false

    # =========================================================================
    # PHASE 2h - SECURITY
    # =========================================================================
    - name: Check if root account is locked
      ansible.builtin.shell:
        cmd: "passwd -S root | awk '{print $2}'"
      register: root_status
      changed_when: false

    - name: Lock root account
      ansible.builtin.command:
        cmd: passwd -l root
      when: root_status.stdout != 'L'
      changed_when: true

    # Only the ACCOUNT is removed. Home directories are deliberately kept: they were
    # migrated to the NVMe above and, on a preserved disk, may hold data that matters.
    - name: Remove other users (accounts only, home directories are kept)
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: false
      loop: "{{ users_to_remove }}"
      register: user_removal
      ignore_errors: true

    - name: Enable nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true

    # =========================================================================
    # PHASE 2i - FINAL ACCESS ENFORCEMENT (Safety Step)
    # =========================================================================
    # Applied only to accounts created by this run (or when reset_ethereum_password=true).
    # A pre-existing ethereum user keeps the password its owner chose.
    - name: Enforce final password for TTY and SSH
      ansible.builtin.user:
        name: "{{ ethereum_user }}"
        password: "{{ ethereum_password | password_hash('sha512') }}"
        update_password: always
      when: ethereum_password_managed | bool
      # Forced at the end to overwrite any package-induced changes

    - name: Force password change on first login (final enforcement)
      ansible.builtin.command:
        cmd: "chage -d 0 {{ ethereum_user }}"
      changed_when: false
      when: ethereum_password_managed | bool

    - name: Configure SSH to guarantee password access
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication yes' }
        - { regexp: '^#?KbdInteractiveAuthentication', line: 'KbdInteractiveAuthentication yes' }
        - { regexp: '^#?UsePAM', line: 'UsePAM yes' }
      notify: Restart ssh

    # Armbian shows a "create your user" wizard on the first root login while this file exists.
    # This is a headless node with its own user, so mark the wizard as done.
    - name: Mark the Armbian first-login wizard as done
      ansible.builtin.file:
        path: /root/.not_logged_in_yet
        state: absent

    # =========================================================================
    # PHASE 2j - FINALIZE
    # =========================================================================
    - name: Create first-run flag
      ansible.builtin.file:
        path: "{{ first_run_flag }}"
        state: touch
        mode: "0644"

    - name: Summarise what was done
      ansible.builtin.debug:
        msg: |-
          Ethereum on ARM provisioning completed successfully!
          NVMe            : {{ target_disk }} {{ 'was FORMATTED' if should_format | bool else 'was kept (data preserved)' }}, mounted on {{ data_mount_point }}
          Previous /home  : {{ ('copied from ' ~ home_mount_source ~ ' (the original files are still on that device, hidden under the mount; view them with: mount --bind / /mnt && ls /mnt' ~ data_mount_point ~ ')') if migrate_home | bool else 'nothing to migrate' }}
          Client configs  : {{ ('restored from ' ~ client_config_backup_dir ~ ' to ' ~ client_config_dir) if config_backup_found | bool else 'no backup found, packages left at their defaults' }}
          Users removed   : {{ users_to_remove | difference(user_removal.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list) | join(', ') or 'none' }} (home directories kept)
          Not removable   : {{ user_removal.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list | join(', ') or 'none' }} (still logged in? remove after the reboot with: sudo userdel <name>)
          Users kept      : {{ users_kept | difference([invoking_user]) | join(', ') or 'none' }}{{ ('; ' ~ invoking_user ~ ' was NOT removed because it launched this run - after the reboot remove it with: sudo userdel ' ~ invoking_user) if invoking_user | length > 0 and invoking_user in users_kept and existing_users_policy == 'remove' else '' }}
          Login           : {{ ethereum_user }} / {{ ethereum_password if ethereum_password_managed | bool else '(existing password)' }}{{ ' (must be changed on first login)' if ethereum_password_managed | bool else '' }}

    - name: Schedule reboot
      ansible.builtin.command:
        cmd: "shutdown -r +1 'Rebooting to apply Ethereum on ARM configuration'"
      async: 1
      poll: 0
      ignore_errors: true
      when: reboot_after | bool

  handlers:
    - name: Restart timesyncd
      ansible.builtin.systemd:
        name: systemd-timesyncd
        state: restarted
      ignore_errors: true

    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted